# Toolchain pin for SlopStudio Pro (picked up automatically by mise when you
# cd into the project; the desktop launcher activates it explicitly).
#
# Node 24 LTS — the same major Electron 44 embeds, so the dev server and the
# packaged app run on one runtime. NOT Node 26: Electron's postinstall
# (extract-zip/yauzl) silently fails to unpack the binary there, leaving `dist/`
# empty and "Electron failed to install correctly" at launch. (Node 24 verified
# to unpack Electron 44 correctly on 2026-09-08.)
[tools]
node = "24"
"npm:pnpm" = "10.33.0"
