<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SlopStudio Pro</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0e14; color: #cbd5e1; font: 14px system-ui, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .name { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; color: #e2e8f0; }
      .bar { width: 160px; height: 3px; border-radius: 2px; background: #1e293b; overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; background: #38bdf8; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
      .hint { font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="name">SlopStudio Pro</div>
      <div class="bar"><i></i></div>
      <div class="hint">Starting the render engine…</div>
    </div>
  </body>
</html>
