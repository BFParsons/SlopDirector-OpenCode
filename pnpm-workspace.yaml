  "brace-expansion@1": ">=1.1.18"
  "brace-expansion@2": ">=2.1.4"
  "brace-expansion@>=3 <6": ">=5.0.9"
  tar: ">=7.5.19"
  shell-quote: ">=1.8.5"
  "js-yaml@4": ">=4.3.1"
  "nanoid@3": ">=3.3.18"
  sharp: ">=0.35.0"
  "form-data@4": ">=4.0.6"
  ip-address: ">=10.3.1"
  axios: ">=1.18.0"
  browserslist: ">=4.28.7"
  deepmerge-ts: ">=8.0.0"
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - "@prisma/client"
